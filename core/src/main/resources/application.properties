spring.application.name=core
server.port=8080

# Neon in development (env SPRING_DATASOURCE_*), local defaults otherwise.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studymate}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studymate}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studymate}

# Own schema "app", created by Hibernate (FastAPI uses the public schema).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false

# Errors as RFC 9457 problem details (clear 400 on invalid input).
spring.mvc.problemdetails.enabled=true

# JWT signing key (HS256): environment variable JWT_SECRET, 32 characters or more. No default.
studymate.jwt.secret=${JWT_SECRET:}
