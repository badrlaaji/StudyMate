name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: studymate
          POSTGRES_PASSWORD: studymate
          POSTGRES_DB: studymate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studymate" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://studymate:studymate@localhost:5432/studymate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install (torch from the CPU index first)
        run: |
          uv venv --python 3.13
          uv pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Tests (no network, plus the database test)
        run: uv run pytest -q

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spring tests
        working-directory: core
        run: ./mvnw -B test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [python, java, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build the images and start the stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: The API sees the database and Spring
        run: |
          for i in $(seq 1 60); do
            body=$(curl -s localhost:8000/health || true)
            echo "$body"
            if echo "$body" | grep -q '"database":true' && echo "$body" | grep -q '"spring":true'; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - name: The web app answers
        run: curl -sf localhost:3000/ > /dev/null
      - name: Stop
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
